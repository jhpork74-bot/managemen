    button.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      input.value = '';
      if (input.hasAttribute('data-stock-quantity')) input.focus();
      input.dispatchEvent(new Event('input', { bubbles: true }));
      if (!input.closest('#stockRows [data-stock-quantity]')) input.dispatchEvent(new Event('change', { bubbles: true }));

    document.querySelectorAll(selector).forEach(attach);

(function () {
  'use strict';
  const Keyboard = window.SimpleKeyboard?.default;
  if (!Keyboard) return;
  const dialog = document.createElement('dialog');
  dialog.id = 'stockKeypad';
  dialog.setAttribute('aria-labelledby', 'stockKeypadTitle');
  dialog.innerHTML = '<div class="stock-keypad-heading"><h2 id="stockKeypadTitle">수량 입력</h2>' +
    '<button type="button" data-keypad-close aria-label="숫자 키패드 닫기">×</button></div>' +
    '<p data-keypad-label></p><output data-keypad-value tabindex="0" autofocus aria-label="입력한 수량" aria-live="polite"></output>' +
    '<div class="stock-keypad-keys" aria-label="숫자 키패드"></div>' +
    '<div class="stock-keypad-actions"><button type="button" data-keypad-cancel>취소</button>' +
    '<button type="button" class="primary" data-keypad-apply>확인</button></div>';
  document.body.appendChild(dialog);
  const label = dialog.querySelector('[data-keypad-label]');
  const preview = dialog.querySelector('[data-keypad-value]');
  const apply = dialog.querySelector('[data-keypad-apply]');
  let target;
  let initial;
  let draft = '';
  let replaceOnDigit = true;

  function update() {
    preview.textContent = draft || '—';
    apply.disabled = stockQuantityText(draft) === null || (target?.id === 'stockPackCustom' && Number(draft) < 1);
  }

  function press(key) {
    if (!dialog.open) return;
    if (key === '{bksp}') {
      draft = draft.slice(0, -1);
    } else if (/^[0-9]$/.test(key)) {
      const next = replaceOnDigit ? key : draft + key;
      if (next.length > 6) return;
      draft = next;
    } else return;
    replaceOnDigit = false;
    update();
  }

  const keyboard = new Keyboard(dialog.querySelector('.stock-keypad-keys'), {
    layout: { default: ['1 2 3', '4 5 6', '7 8 9', '{empty} 0 {bksp}'] },
    display: { '{empty}': '', '{bksp}': '⌫' },
    buttonAttributes: [
      { attribute: 'aria-label', value: '한 자리 지우기', buttons: '{bksp}' },
      { attribute: 'disabled', value: 'disabled', buttons: '{empty}' },
      { attribute: 'aria-hidden', value: 'true', buttons: '{empty}' }
    ],
    useButtonTag: true,
    onKeyPress: press
  });

  function show(input) {
    if (dialog.open || input.disabled || input.readOnly || input.closest('[aria-busy="true"]')) return;
    target = input;
    initial = input.value;
    draft = stockQuantityText(initial) || '';
    replaceOnDigit = true;
    label.textContent = input.getAttribute('aria-label') || input.labels?.[0]?.textContent.trim() || input.placeholder || '재고 수량';
    keyboard.clearInput();
    update();
    dialog.showModal();
    preview.focus();
  }

  function confirmQuantity() {
    if (apply.disabled || !target?.isConnected || target.disabled || target.value !== initial) {
      if (!apply.disabled) dialog.close();
      return;
    }
    target.value = String(Number(draft));
    target.dispatchEvent(new Event('input', { bubbles: true }));
    target.dispatchEvent(new Event('change', { bubbles: true }));
    dialog.close();
  }

  document.addEventListener('click', function (event) {
    if (event.target.matches('input[data-stock-quantity]')) show(event.target);
  });
  dialog.querySelector('[data-keypad-close]').onclick = () => dialog.close();
  dialog.querySelector('[data-keypad-cancel]').onclick = () => dialog.close();
  apply.onclick = confirmQuantity;
  dialog.addEventListener('keydown', function (event) {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (/^[0-9]$/.test(event.key) || event.key === 'Backspace') {
      event.preventDefault();
      press(event.key === 'Backspace' ? '{bksp}' : event.key);
    } else if (event.key === 'Enter' && !event.target.closest('button')) {
      event.preventDefault();
      confirmQuantity();
    }
  });
})();

</script>
