<style>.dc-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dc-day{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:105px;min-width:0;white-space:normal;overflow-wrap:anywhere;padding:8px}.dc-day:disabled{background:#f2f4f6}.dc-changed{background:#fff4d9;border:2px solid #dba128}.dc-selected{outline:2px solid #176b9a}.dc-lunch{font-size:13px;color:#735214}.dc-weekday{text-align:center;font-weight:bold;padding:7px}#dcHistory table{width:100%;table-layout:fixed}#dcHistory td{overflow-wrap:anywhere}#dcDialog{width:min(580px,94vw)}#dcStatus{padding:10px;background:#edf5fb}@media(max-width:600px){.dc-calendar{gap:2px}.dc-day{padding:5px 2px;font-size:12px;min-height:85px}.dc-lunch{font-size:11px}}</style>
<script>
var DutyChangesCore=(function(){
 'use strict';const clone=x=>JSON.parse(JSON.stringify(x));
 function validate(site,month){if(!['one','two'].includes(site)||!DutyRosterCore.validMonth(month))throw Error('장소와 조회 월을 확인하세요.')}
 function pair(e){return {primaryId:e.primaryId,primaryName:e.primaryName,lunchRequired:!!e.lunchRequired,lunchId:e.lunchRequired?e.lunchId:null,lunchName:e.lunchRequired?e.lunchName:'',pairFixed:!!e.pairFixed,directorLunch:!!e.directorLunch}}
 function same(a,b){return a.primaryId===b.primaryId&&a.lunchRequired===b.lunchRequired&&(!a.lunchRequired||a.lunchId===b.lunchId)}
 function store(data,site){return data.dutyChanges&&data.dutyChanges.sites&&data.dutyChanges.sites[site]||{entries:{},history:[]}}
 function view(data,site,month){validate(site,month);const source=data.dutyManagement&&data.dutyManagement.sites&&data.dutyManagement.sites[site]&&data.dutyManagement.sites[site].months[month];if(!source)return null;const result=clone(source),changes=store(data,site);for(const date of Object.keys(result.entries)){const change=(changes.entries||{})[date];if(change){result.entries[date]={...result.entries[date],...clone(change.after),requestedChange:true};result.entries[date].baselineChanged=!same(pair(source.entries[date]),change.baseline)}}return result}
 function preview(data,site,date,primaryId){const d=DutyRosterCore.normalize(data.dutyManagement),month=date.slice(0,7);validate(site,month);const primary=DutyRosterCore.activeEmployees(d,site).find(e=>e.id===primaryId);if(!primary)throw Error('현재 장소의 당직자를 선택하세요.');const rule=DutyRosterCore.policyAt(d.sites[site].settings,date)||{},row=rule.mode==='byPerson'?(rule.assignments||[]).find(r=>r.primaryId===primaryId):rule.mode==='fixed'&&rule.primaryId===primaryId?rule:null;if(row&&row.mode==='fixed'){const lunch=DutyRosterCore.fixedLunchEmployees(d,site).find(e=>e.id===row.lunchId);if(!lunch||lunch.id===primaryId)throw Error('고정 점심대체자의 소속·사용 상태를 확인하세요.');return {primaryId,primaryName:primary.name,lunchRequired:true,lunchId:lunch.id,lunchName:lunch.name,pairFixed:true,directorLunch:false}}const r=DutyRosterCore.applyDay(d,site,month,date,{primaryId,assignmentMode:'auto'});return pair(r.entries[date])}
 function writable(data,site){const result=clone(data);result.dutyChanges=result.dutyChanges||{schema:1,sites:{}};result.dutyChanges.sites=result.dutyChanges.sites||{};const old=result.dutyChanges.sites[site]||{};result.dutyChanges.sites[site]={...old,entries:old.entries||{},history:old.history||[]};return result}
 function apply(data,site,date,input){
  validate(site,date.slice(0,7));if(!DutyRosterCore.validDate(date))throw Error('변경 날짜를 확인하세요.');const current=view(data,site,date.slice(0,7));if(!current||!current.entries[date])throw Error('원본 당직표에 있는 근무일을 선택하세요.');
  const d=DutyRosterCore.normalize(data.dutyManagement),primary=DutyRosterCore.activeEmployees(d,site).find(e=>e.id===input.primaryId);if(!primary)throw Error('현재 장소의 당직자를 선택하세요.');let lunch=null;if(input.lunchRequired){lunch=DutyRosterCore.fixedLunchEmployees(d,site).find(e=>e.id===input.lunchId);if(!lunch||lunch.id===primary.id)throw Error('당직자와 다른 점심대체자를 선택하세요.')}
  const before=pair(current.entries[date]),after={primaryId:primary.id,primaryName:primary.name,lunchRequired:!!lunch,lunchId:lunch?lunch.id:null,lunchName:lunch?lunch.name:'',pairFixed:!!lunch,directorLunch:false};
  if(same(before,after))return {data:clone(data),changed:false};const result=writable(data,site),changes=result.dutyChanges.sites[site],base=pair(data.dutyManagement.sites[site].months[date.slice(0,7)].entries[date]);
  const previous=(store(data,site).entries||{})[date];changes.entries[date]={...(previous?clone(previous):{}),baseline:base,after};changes.history.push({kind:'change',beforeChange:previous?clone(previous):null,baselineAtChange:clone(base),id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),date,before,after});return {data:result,changed:true};
 }
 function cancel(data,site,date){validate(site,date.slice(0,7));const current=view(data,site,date.slice(0,7)),change=(store(data,site).entries||{})[date];if(!current||!current.entries[date]||!change)return {data:clone(data),changed:false};const result=writable(data,site),changes=result.dutyChanges.sites[site],before=pair(current.entries[date]),after=pair(data.dutyManagement.sites[site].months[date.slice(0,7)].entries[date]);delete changes.entries[date];changes.history.push({kind:'reset',beforeChange:clone(change),baselineAtChange:clone(after),id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),date,before,after});return {data:result,changed:true};}
 function undoCandidate(data,site,month){
  validate(site,month);const history=store(data,site).history||[],undone=new Set(history.filter(h=>h.kind==='undo'&&h.undoOf).map(h=>h.undoOf));
  return history.slice().reverse().find(h=>h.kind!=='undo'&&h.id&&h.date&&h.date.startsWith(month+'-')&&!undone.has(h.id))||null;
 }
 function undoLast(data,site,month){
  const target=undoCandidate(data,site,month);if(!target)return {data:clone(data),changed:false};
  const date=target.date,current=view(data,site,month);if(!current||!current.entries[date])throw Error('복구할 날짜의 원본 당직표가 없습니다. 원본부터 확인하세요.');
  const before=pair(current.entries[date]),base=pair(data.dutyManagement.sites[site].months[month].entries[date]),oldEntry=(store(data,site).entries||{})[date],expectedBase=target.baselineAtChange||(oldEntry&&oldEntry.baseline);
  if(!target.before||!target.after||!same(before,target.after))throw Error('현재 배치가 마지막 변경이력과 다릅니다. 새로고침 후 확인하세요.');
  if(expectedBase&&!same(base,expectedBase))throw Error('원본 당직표가 변경되어 자동 복구를 멈췄습니다. 원본과 변경이력을 확인하세요.');
  const result=writable(data,site),changes=result.dutyChanges.sites[site];
  if(Object.prototype.hasOwnProperty.call(target,'beforeChange')){
   if(target.beforeChange===null)delete changes.entries[date];else changes.entries[date]=clone(target.beforeChange);
  }else if(same(base,target.before))delete changes.entries[date];
  else changes.entries[date]={...(oldEntry?clone(oldEntry):{}),baseline:clone(base),after:clone(target.before)};
  const after=pair(view(result,site,month).entries[date]);
  changes.history.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),date,before,after,kind:'undo',undoOf:target.id,baselineAtChange:clone(base)});
  return {data:result,changed:true,date,restoredId:target.id,undo:true};
 }

 return {pair,view,preview,apply,cancel,store,undoCandidate,undoLast};
})();

(()=>{
 'use strict';if(document.getElementById('dutyChanges'))return;const C=DutyChangesCore,D=DutyRosterCore,$c=id=>document.getElementById(id);let site='one',month=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date()).slice(0,7),selected='',busy=false,jandiSending=false,navigationDate='';
 const nav=document.createElement('button');nav.type='button';nav.dataset.tab='dutyChanges';nav.textContent='🔄 당직변경화면';document.querySelector('[data-tab="dutyManagement"]').after(nav);
 const section=document.createElement('section');section.id='dutyChanges';section.className='hidden';section.innerHTML='<div class="panel"><div class="toolbar"><h2>🔄 당직변경화면</h2><div class="flex"><select id="dcSite" aria-label="변경 장소"><option value="one">본관</option><option value="two">분관</option></select><input id="dcMonth" type="month" aria-label="변경 조회 월"></div></div><p>원본 당직표를 기준으로 표시합니다. 변경 신청을 저장하면 이 화면에 즉시 반영하고 원본 당직표는 유지합니다.</p><p id="dcStatus" role="status"></p><div id="dcCalendar" class="dc-calendar"></div><h3 id="dcHistoryTitle">변경이력</h3><div id="dcHistory"></div></div>';document.querySelector('main').appendChild(section);nav.onclick=()=>switchTab('dutyChanges');
 const undoButton=document.createElement('button');undoButton.id='dcUndoLast';undoButton.type='button';undoButton.textContent='1개씩 복구';undoButton.style.minHeight='44px';section.querySelector('h2').after(undoButton);
 function refreshUndo(){const next=C.undoCandidate(data,site,month);undoButton.disabled=busy||jandiSending||!cloudReady||cloudBlocked||!next;undoButton.title=next?next.date+' · '+describe(next.after)+' → '+describe(next.before):'복구할 변경이 없습니다.'}
 const dialog=document.createElement('dialog');dialog.id='dcDialog';dialog.innerHTML='<form id="dcForm"><h2 id="dcTitle">당직변경 신청</h2><p id="dcBefore"></p><label>변경할 당직자<select id="dcPrimary" required></select></label><label><input type="checkbox" id="dcLunchRequired"> 변경 후 점심대체 필요</label><label id="dcLunchField">변경할 점심대체자<select id="dcLunch"></select></label><p>당직자를 바꾸면 그 직원의 기본 대체 규칙을 함께 불러옵니다. 필요한 경우 대체자를 직접 고르세요.</p><p id="dcHelp" role="status"></p><div class="flex"><button type="submit" id="dcSubmit" class="primary">신청 저장·즉시 반영</button><button type="button" id="dcCancelChange">원본 배치로 되돌리기</button><button type="button" id="dcClose">닫기</button></div></form>';document.body.appendChild(dialog);
 const siteName=()=>site==='one'?'본관':'분관',describe=p=>p.primaryName+(p.lunchRequired?' · 점심 '+(p.lunchName||'미지정'):'');
 function options(people,id){return '<option value="">직원 선택</option>'+people.map(e=>'<option value="'+esc(e.id)+'" '+(e.id===id?'selected':'')+'>'+esc(e.name)+(!e.site?' (미배정)':'')+'</option>').join('')}
 function renderChanges(){refreshUndo();if(cloudReady&&navigationDate){selected=navigationDate;navigationDate=''}const roster=C.view(data,site,month);$c('dcSite').value=site;$c('dcMonth').value=month;if(!roster){$c('dcCalendar').innerHTML='<p>이 장소·월의 원본 당직표를 먼저 작성하세요.</p>';$c('dcHistory').innerHTML='';$c('dcStatus').textContent='원본 작성 후 이 화면에 표시됩니다.';return}const entries=roster.entries,dates=Object.keys(entries).sort();if(!entries[selected])selected=dates[0]||'';const [y,m]=month.split('-').map(Number),first=new Date(month+'-01T12:00:00Z').getUTCDay(),last=new Date(Date.UTC(y,m,0)).getUTCDate();let html=['일','월','화','수','목','금','토'].map(x=>'<div class="dc-weekday">'+x+'</div>').join('');for(let i=0;i<first;i++)html+='<div></div>';for(let day=1;day<=last;day++){const date=month+'-'+String(day).padStart(2,'0'),entry=entries[date],holiday=(roster.holidays||{})[date];html+='<button type="button" class="dc-day '+(entry&&entry.requestedChange?'dc-changed ':'')+(date===selected?'dc-selected':'')+'" data-dc-date="'+date+'" '+(!entry?'disabled':'')+'><strong>'+day+'</strong>'+(entry?'<span>'+esc(entry.primaryName)+'</span>'+(entry.lunchRequired?'<span class="dc-lunch">점심 '+esc(entry.lunchName||'미지정')+'</span>':'')+(entry.requestedChange?'<small>변경 반영</small>':'')+(entry.baselineChanged?'<small>원본도 변경됨 · 확인 필요</small>':''):holiday?'<small>'+esc(holiday)+'</small>':'')+'</button>'}$c('dcCalendar').innerHTML=html;$c('dcCalendar').querySelectorAll('[data-dc-date]').forEach(b=>b.onclick=()=>{if(busy||jandiSending)return;selected=b.dataset.dcDate;renderChanges();openDay()});const history=(C.store(data,site).history||[]).filter(h=>h.date===selected).slice().reverse();$c('dcHistoryTitle').textContent=(selected||month)+' 변경이력';$c('dcHistory').innerHTML=history.length?'<table><thead><tr><th>이전 사람</th><th>현재 사람</th></tr></thead><tbody>'+history.map(h=>'<tr><td>'+esc(describe(h.before))+'</td><td>'+esc(describe(h.after))+'</td></tr>').join('')+'</tbody></table>':'<p>선택한 날짜의 변경이력이 없습니다.</p>';$c('dcStatus').textContent=siteName()+' '+month+' · 변경 반영 '+dates.filter(date=>entries[date].requestedChange).length+'일';}
 function toggleLunch(){const required=$c('dcLunchRequired').checked;$c('dcLunchField').classList.toggle('hidden',!required);$c('dcLunch').required=required;if(!required)$c('dcLunch').value=''}
 function openDay(){if(busy||jandiSending||!cloudReady||cloudBlocked)return;const entry=C.view(data,site,month)?.entries[selected];if(!entry)return;const d=D.normalize(data.dutyManagement);$c('dcTitle').textContent=siteName()+' '+selected+' 당직변경 신청';$c('dcBefore').textContent='현재 배치: '+describe(entry);$c('dcPrimary').innerHTML=options(D.activeEmployees(d,site),entry.primaryId);$c('dcLunch').innerHTML=options(D.fixedLunchEmployees(d,site),entry.lunchId);$c('dcLunchRequired').checked=entry.lunchRequired;$c('dcHelp').textContent='';$c('dcCancelChange').disabled=!(C.store(data,site).entries||{})[selected];toggleLunch();dialog.showModal()}
 $c('dcPrimary').onchange=()=>{try{const p=C.preview(data,site,selected,$c('dcPrimary').value);$c('dcLunchRequired').checked=p.lunchRequired;$c('dcLunch').value=p.lunchId||'';toggleLunch();$c('dcHelp').textContent=p.lunchRequired?'선택한 직원의 점심대체자를 함께 불러왔습니다.':'점심대체가 필요 없는 직원이므로 이전 대체자를 제외했습니다.'}catch(error){$c('dcHelp').textContent=error.message;$c('dcLunchRequired').checked=false;toggleLunch()}};$c('dcLunchRequired').onchange=toggleLunch;$c('dcClose').onclick=()=>{if(!busy)dialog.close()};
 async function persist(change){if(!change.changed){$c('dcHelp').textContent='바뀐 내용이 없습니다.';return}const notice={site,eventId:(C.store(change.data,site).history||[]).slice(-1)[0]?.id};busy=true;$c('dcSite').disabled=true;$c('dcMonth').disabled=true;dialog.querySelectorAll('input,select').forEach(el=>el.disabled=true);$c('dcSubmit').disabled=true;$c('dcCancelChange').disabled=true;$c('dcHelp').textContent='원본 서버 저장 확인 중…';try{data=change.data;render();await saveAndWait();dialog.close();renderChanges();$c('dcStatus').textContent=change.undo?change.date+' 변경 1건 복구·서버 저장 완료 · 잔디는 전송 버튼을 눌러야 보냅니다.':'변경 일정 서버 저장 완료 · 계속 수정하거나 제목 옆 ‘잔디로 이미지 전송’을 누르세요.';if(window.DutyJandi&&notice.eventId){try{await window.DutyJandi.onSaved(notice)}catch(error){/* Notice failure must never turn a canonical save into a save error. */}}}catch(error){$c('dcHelp').textContent='저장 완료 미확인 · 임시본 유지: '+error.message;$c('dcStatus').textContent=$c('dcHelp').textContent}finally{busy=false;$c('dcSite').disabled=false;$c('dcMonth').disabled=false;dialog.querySelectorAll('input,select').forEach(el=>el.disabled=false);$c('dcSubmit').disabled=false;$c('dcCancelChange').disabled=!(C.store(data,site).entries||{})[selected];refreshUndo()}}
 undoButton.onclick=()=>{if(busy||jandiSending||!cloudReady||cloudBlocked)return;try{const result=C.undoLast(data,site,month);if(!result.changed){refreshUndo();return}selected=result.date;persist(result)}catch(error){$c('dcStatus').textContent=error.message}};
 $c('dcForm').onsubmit=event=>{event.preventDefault();if(busy||jandiSending||!cloudReady||cloudBlocked)return;try{persist(C.apply(data,site,selected,{primaryId:$c('dcPrimary').value,lunchRequired:$c('dcLunchRequired').checked,lunchId:$c('dcLunch').value}))}catch(error){$c('dcHelp').textContent=error.message}};
 $c('dcCancelChange').onclick=()=>{if(busy||jandiSending||!cloudReady||cloudBlocked||!confirm('이 날짜를 원본 배치로 되돌릴까요? 변경이력은 유지합니다.'))return;try{persist(C.cancel(data,site,selected))}catch(error){$c('dcHelp').textContent=error.message}};
 $c('dcSite').onchange=()=>{if(busy||jandiSending)return;site=$c('dcSite').value;selected='';renderChanges()};$c('dcMonth').onchange=()=>{if(busy||jandiSending||!D.validMonth($c('dcMonth').value))return;month=$c('dcMonth').value;selected='';renderChanges()};const oldRender=render;render=function(){oldRender();if(tab==='dutyChanges')renderChanges()};
window.DutyChangesView={getContext:()=>({site,month,selected,busy:busy||jandiSending}),setSending:value=>{jandiSending=!!value;$c('dcSite').disabled=busy||jandiSending;$c('dcMonth').disabled=busy||jandiSending;refreshUndo()}};

</script>
