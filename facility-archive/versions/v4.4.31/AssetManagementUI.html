<script>
var AssetCore=(()=>{
 'use strict';
 const clone=v=>JSON.parse(JSON.stringify(v)),same=(a,b)=>JSON.stringify(a)===JSON.stringify(b),validId=v=>typeof v==='string'&&/^[A-Za-z0-9_.:-]{1,80}$/.test(v);
 const states=['사용중','불용예정','불용완료'];
 function date(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===v}
 function text(v,label,max=200,required=true){if(typeof v!=='string'||v.length>max||required&&!v.trim())throw Error(label+'을 확인하세요.');return v.trim()}
 function store(data){
  const s=data.assetManagement;if(s!=null&&(!s||typeof s!=='object'||Array.isArray(s)))throw Error('기존 재물관리 자료 형식을 확인하세요.');
  const r=clone(s||{});if(r.schemaVersion&&r.schemaVersion!==1)throw Error('더 최신 재물관리 자료입니다. 프로그램 버전을 확인하세요.');
  for(const key of ['items','locations','movements','surveys','statusHistory']){if(r[key]!=null&&!Array.isArray(r[key]))throw Error('재물관리 '+key+' 자료 형식을 확인하세요.');r[key]=r[key]||[]}
  r.schemaVersion=1;return r;
 }
 function wrap(data,s){return {...data,assetManagement:s}}
 function location(s,id){const l=s.locations.find(x=>x&&x.id===id&&x.active!==false);if(!l)throw Error('등록된 장소를 선택하세요.');return l}
 function addLocation(data,{id,name}){const s=store(data);if(!validId(id))throw Error('장소 번호 오류');name=text(name,'장소명',80);const old=s.locations.find(x=>x&&x.id===id);if(old){if(old.name!==name)throw Error('장소 번호가 중복됩니다.');return data}if(s.locations.some(x=>x&&x.name===name))throw Error('이미 등록된 장소입니다.');s.locations.push({id,name,active:true});return wrap(data,s)}
 function upsert(data,record,today){
  if(!date(today)||!record||!validId(record.id))throw Error('물품 등록 정보를 확인하세요.');
  const s=store(data),old=s.items.find(x=>x&&x.id===record.id),r={...old,...record};
  r.assetNo=text(r.assetNo,'관리번호',80);r.name=text(r.name,'물품명',160);r.department=text(r.department||'','부서',100,false);r.manager=text(r.manager||'','담당자',100,false);r.note=text(r.note||'','비고',2000,false);
  if(!Number.isSafeInteger(r.quantity)||r.quantity<1||r.quantity>1000000)throw Error('수량은 1 이상의 정수로 입력하세요.');
  if(r.acquiredDate&&(!date(r.acquiredDate)||r.acquiredDate>today))throw Error('취득일을 확인하세요.');r.acquiredDate=r.acquiredDate||'';
  if(s.items.some(x=>x&&x.id!==r.id&&String(x.assetNo).trim().toLowerCase()===r.assetNo.toLowerCase()))throw Error('이미 등록된 관리번호입니다.');
  const l=location(s,r.locationId);
  if(old){if(r.locationId!==old.locationId)throw Error('장소는 이동경로 추적 창에서 변경하세요.');if(r.status!==old.status)throw Error('불용 상태는 전용 버튼에서 변경하세요.');r.firstLocationId=old.firstLocationId;r.firstLocationName=old.firstLocationName;r.createdDate=old.createdDate;r.lastSurveyDate=old.lastSurveyDate||'';}
  else{r.firstLocationId=l.id;r.firstLocationName=l.name;r.createdDate=today;r.status='사용중';r.lastSurveyDate='';}
  r.locationName=l.name;if(r.photo!=null&&typeof r.photo!=='string')throw Error('사진 연결 정보를 확인하세요.');r.photo=r.photo||'';r.updatedDate=today;
  if(old)s.items=s.items.map(x=>x&&x.id===r.id?r:x);else s.items.push(r);return wrap(data,s);
 }
 function move(data,entry,today){
  const s=store(data);if(!entry||!validId(entry.id)||!validId(entry.itemId)||!date(entry.date)||!date(today)||entry.date>today)throw Error('이동일과 물품 정보를 확인하세요.');
  const duplicate=s.movements.find(x=>x&&x.id===entry.id);if(duplicate){if(duplicate.itemId!==entry.itemId||duplicate.toLocationId!==entry.toLocationId||duplicate.date!==entry.date||duplicate.note!==(entry.note||'').trim())throw Error('같은 이동 요청의 내용이 달라졌습니다.');return data}
  const item=s.items.find(x=>x&&x.id===entry.itemId);if(!item)throw Error('등록된 물품이 없습니다.');if(item.status==='불용완료')throw Error('불용처리 완료 물품은 이동할 수 없습니다.');
  const last=s.movements.filter(x=>x&&x.itemId===item.id).slice(-1)[0];if(entry.date<(last?last.date:item.createdDate))throw Error('이동일은 최초 등록일 또는 마지막 이동일 이후여야 합니다.');
  if(entry.expectedLocationId!==item.locationId)throw Error('물품의 현재 장소가 바뀌었습니다. 최신 내용을 다시 확인하세요.');
  const target=location(s,entry.toLocationId);if(target.id===item.locationId)throw Error('현재 장소와 다른 마지막장소를 선택하세요.');
  s.movements.push({id:entry.id,itemId:item.id,date:entry.date,firstLocationId:item.firstLocationId,firstLocationName:item.firstLocationName,fromLocationId:item.locationId,fromLocationName:item.locationName,toLocationId:target.id,toLocationName:target.name,note:text(entry.note||'','이동 메모',1000,false),quantity:item.quantity});
  item.locationId=target.id;item.locationName=target.name;item.updatedDate=today;return wrap(data,s);
 }
 function survey(data,{id,itemIds,date:day},today){
  if(!validId(id)||!date(day)||!date(today)||day>today)throw Error('조사일을 확인하세요.');
  if(!Array.isArray(itemIds)||!itemIds.length||new Set(itemIds).size!==itemIds.length)throw Error('조사 완료한 물품을 선택하세요.');
  const s=store(data),prior=s.surveys.find(x=>x&&x.id===id);if(prior){if(prior.date!==day||!same(prior.itemIds,itemIds))throw Error('같은 조사 요청의 내용이 달라졌습니다.');return data}
  const records=itemIds.map(id=>{const item=s.items.find(x=>x&&x.id===id);if(!item||item.status==='불용완료')throw Error('사용 중이거나 불용 예정인 물품만 조사할 수 있습니다.');if(day<item.createdDate||item.lastSurveyDate&&day<item.lastSurveyDate)throw Error('조사일은 등록일 또는 마지막 조사일 이후여야 합니다.');return item});
  s.surveys.push({id,date:day,itemIds:[...itemIds],items:records.map(x=>({id:x.id,assetNo:x.assetNo,name:x.name,quantity:x.quantity,locationId:x.locationId,locationName:x.locationName,status:x.status}))});
  records.forEach(x=>x.lastSurveyDate=day);return wrap(data,s);
 }
 function changeStatus(data,{id,itemIds,status,date:day},today){
  if(!validId(id)||!Array.isArray(itemIds)||!itemIds.length||new Set(itemIds).size!==itemIds.length||!['불용예정','불용완료','사용중'].includes(status)||!date(day)||!date(today)||day>today)throw Error('대상 물품·처리일·상태를 확인하세요.');
  const s=store(data),old=s.statusHistory.find(x=>x&&x.id===id);if(old){if(old.status!==status||old.date!==day||!same(old.itemIds,itemIds))throw Error('같은 처리 요청의 내용이 달라졌습니다.');return data}
  const records=itemIds.map(id=>{const x=s.items.find(x=>x&&x.id===id);if(!x)throw Error('등록된 물품이 없습니다.');if(day<x.createdDate)throw Error('처리일을 확인하세요.');if(status==='불용완료'&&x.status!=='불용예정')throw Error('불용예정으로 저장한 물품만 완료 처리할 수 있습니다.');if(status==='불용예정'&&x.status!=='사용중'||status==='사용중'&&x.status!=='불용예정')throw Error('선택한 상태로 변경할 수 없는 물품이 있습니다.');return x});
  s.statusHistory.push({id,itemIds:[...itemIds],date:day,status,before:records.map(x=>({id:x.id,status:x.status}))});records.forEach(x=>{x.status=status;x.updatedDate=today});return wrap(data,s);
 }
 function assignManager(data,{itemIds,manager},today){
  if(!date(today)||!Array.isArray(itemIds)||!itemIds.length||new Set(itemIds).size!==itemIds.length)throw Error('담당자를 지정할 물품을 선택하세요.');
  manager=text(manager,'담당자',100);const s=store(data),ids=new Set(itemIds);
  if(itemIds.some(id=>!validId(id)||!s.items.some(x=>x&&x.id===id)))throw Error('선택 물품이 변경되었습니다. 최신 목록에서 다시 선택하세요.');
  s.items=s.items.map(x=>x&&ids.has(x.id)?{...x,manager,updatedDate:today}:x);return wrap(data,s);
 }
 return {store,addLocation,upsert,assignManager,move,survey,changeStatus,date,states};
})();

// Bounded private-photo cache and shared two-request queue. No business-data writes.
function createAssetPhotoLoader(fetcher,cache=new Map(),limit=2,maxCache=40){
 const pending=new Map(),queue=[];let active=0;
 function remember(ref,src){cache.delete(ref);cache.set(ref,src);while(cache.size>maxCache)cache.delete(cache.keys().next().value);return src}
 function drain(){while(active<limit&&queue.length){const job=queue.shift();active++;Promise.resolve().then(()=>fetcher(job.id,job.ref)).then(src=>job.resolve(remember(job.ref,src)),job.reject).finally(()=>{active--;pending.delete(job.key);drain()})}}
 function load(id,ref){if(cache.has(ref))return Promise.resolve(remember(ref,cache.get(ref)));const key=JSON.stringify([id,ref]);if(pending.has(key))return pending.get(key);const promise=new Promise((resolve,reject)=>queue.push({id,ref,key,resolve,reject}));pending.set(key,promise);drain();return promise}
 return {load,cache};
}

 for(const [btn,input] of [['assetCamera','assetCameraFile'],['assetGallery','assetGalleryFile']]){$a(btn).onclick=()=>{$a(input).value='';$a(input).click()};$a(input).addEventListener('cancel',()=>{$a('assetFormStatus').textContent='사진 선택을 취소했습니다. 갤러리 버튼으로 다시 선택하세요.'});$a(input).onchange=async()=>{const file=$a(input).files?.[0];if(!file)return;const token=session;processing=true;setBusy(false);try{if(!file.type.startsWith('image/'))throw Error('이미지 파일을 선택하세요.');const image=new Image(),url=URL.createObjectURL(file);try{await new Promise((ok,no)=>{image.onload=ok;image.onerror=()=>no(Error('읽을 수 없는 이미지입니다. JPG 또는 PNG로 다시 선택하세요.'));image.src=url})}finally{URL.revokeObjectURL(url)}const canvas=document.createElement('canvas'),scale=Math.min(1,960/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let result='';for(const quality of [.65,.45,.3]){result=canvas.toDataURL('image/jpeg',quality);if(result.length<115000)break}if(result.length>160000)throw Error('사진을 더 작은 크기로 선택하세요.');if(token===session&&form.open){photo=result;photoRequest=null;preview();$a('assetFormStatus').textContent='사진 준비 완료 · 저장하면 회사 Drive에 등록됩니다.'}}catch(e){$a('assetFormStatus').textContent=e.message}finally{processing=false;$a(input).value='';setBusy(false)}}}

 const L=AssetLabelCore;let labelItems=[],labelFingerprint='',labelPrinting=false,labelChecking=false,labelSettingsOriginal={};
 const labelDialog=dialog('assetLabelDialog',`<form id="assetLabelForm"><h2>라벨지출력</h2><p>선택 물품의 재물조사표 스티커를 만듭니다. 기관 양식과 라벨지 규격에 맞춰 조정하고 미리보기를 확인하세요.</p><div class="asset-form-grid"><label>기관명<input id="assetLabelInstitution" maxlength="80" required placeholder="스티커에 들어갈 기관명"></label><label>재물조사 연도<input id="assetLabelYear" type="number" min="1990" max="2200" step="1" required></label><label class="asset-full">폼텍 제품 선택<select id="assetLabelProduct"><option value="custom">제품 미정 / 직접 설정</option></select></label><label>용지<select id="assetLabelPaper"><option value="a4">A4 라벨지 · 여러 칸</option><option value="single">라벨 프린터 · 한 장씩</option></select></label><label>글자 크기(pt)<input id="assetLabelFont" type="number" min="7" max="14" step="0.5" required></label><label>라벨 너비(mm)<input id="assetLabelWidth" type="number" min="35" max="190" step="0.01" required></label><label>라벨 높이(mm)<input id="assetLabelHeight" type="number" min="25" max="270" step="0.01" required></label><label>가로 칸 수<input id="assetLabelColumns" type="number" min="1" max="5" step="1" required></label><label>세로 칸 수<input id="assetLabelRows" type="number" min="1" max="10" step="1" required></label><label>가로 간격(mm)<input id="assetLabelGapX" type="number" min="0" max="20" step="0.01" required></label><label>세로 간격(mm)<input id="assetLabelGapY" type="number" min="0" max="20" step="0.01" required></label><label>좌우 여백(mm)<input id="assetLabelMarginX" type="number" min="0" max="40" step="0.01" required></label><label>상하 여백(mm)<input id="assetLabelMarginY" type="number" min="0" max="40" step="0.01" required></label><label>가로 위치 보정(mm)<input id="assetLabelOffsetX" type="number" min="-10" max="10" step="0.01" required></label><label>세로 위치 보정(mm)<input id="assetLabelOffsetY" type="number" min="-10" max="10" step="0.01" required></label><label>첫 출력 칸<input id="assetLabelStart" type="number" min="1" step="1" required></label><label>물품별 출력 매수<input id="assetLabelCopies" type="number" min="1" max="20" step="1" required></label></div><p class="asset-muted">첫 출력 칸은 왼쪽 위부터 가로 순서입니다. 이미 사용한 라벨 칸을 건너뛸 수 있습니다. ‘조사일’은 실제 저장된 조사일이며 미조사 물품은 미조사로 표시합니다.</p><fieldset class="asset-label-fields"><legend>추가 표시 항목</legend><label><input type="checkbox" id="assetLabelShowAcquired"> 취득일</label><label><input type="checkbox" id="assetLabelShowSurvey"> 조사일</label><label><input type="checkbox" id="assetLabelShowDepartment"> 부서</label><label><input type="checkbox" id="assetLabelShowManager"> 담당자</label><label><input type="checkbox" id="assetLabelShowLocation"> 현재장소</label><label><input type="checkbox" id="assetLabelShowQuantity"> 수량</label></fieldset><div class="asset-label-toolbar"><button type="button" id="assetLabelPreset">선택 규격 다시 적용</button><button type="button" id="assetLabelSave">양식 설정 저장</button><button type="submit" id="assetLabelPreviewButton">인쇄 미리보기</button></div><p id="assetLabelPresetNote" class="asset-muted"></p><p id="assetLabelStatus" role="status"></p><div id="assetLabelPreview" class="asset-label-preview" tabindex="0" aria-label="재물조사표 스티커 미리보기"></div><p class="asset-muted">인쇄창에서 설정된 네트워크 프린터를 선택하세요. 라벨지 용지 크기 일치 · 배율 100% · 머리글/바닥글 끔. 먼저 일반 종이 한 장으로 위치를 맞추는 것을 권합니다. 실제 출력 여부는 프린터에서 확인합니다.</p><div class="asset-dialog-actions"><button type="button" data-label-close>닫기</button><button type="button" class="primary" id="assetLabelPrint">프린터 선택·출력</button></div></form>`);
 const printSheet=document.createElement('section');printSheet.id='assetPrintSheet';printSheet.className='asset-print-only';document.body.appendChild(printSheet);
 const labelPageStyle=document.createElement('style');labelPageStyle.id='assetLabelPageStyle';document.head.appendChild(labelPageStyle);
 const labelInputs={institution:'Institution',year:'Year',paper:'Paper',preset:'Product',offsetX:'OffsetX',offsetY:'OffsetY',fontPt:'Font',width:'Width',height:'Height',columns:'Columns',rows:'Rows',gapX:'GapX',gapY:'GapY',marginX:'MarginX',marginY:'MarginY',start:'Start',copies:'Copies'};
 const labelFlags={acquiredDate:'Acquired',surveyDate:'Survey',department:'Department',manager:'Manager',location:'Location',quantity:'Quantity'};
 for(const preset of L.presets){const option=document.createElement('option');option.value=preset.id;option.textContent='폼텍 '+preset.code+' · '+(preset.columns*preset.rows)+'칸 · '+preset.width+'×'+preset.height+'mm (LS/LQ)';$a('assetLabelProduct').appendChild(option)}
 function labelPresetNote(){const preset=L.presets.find(x=>x.id===$a('assetLabelProduct').value);$a('assetLabelPresetNote').textContent=preset?'폼텍 '+preset.code+' 크기·칸수 기준입니다. 간격·여백은 중앙 배치 초기값이므로 일반 종이로 맞춤 확인 후 위치를 보정하세요.':'제품이 아직 정해지지 않았습니다. 제품번호를 선택하거나 직접 크기를 입력하세요.'}
 function labelPresetBase(){return {...L.defaults,...labelSettingsOriginal,institution:$a('assetLabelInstitution').value,year:$a('assetLabelYear').value,start:1,copies:Number($a('assetLabelCopies').value)||1,show:Object.fromEntries(Object.entries(labelFlags).map(([key,suffix])=>[key,$a('assetLabelShow'+suffix).checked]))}}
 function labelFill(settings){const s=L.normalize(settings);for(const [key,suffix] of Object.entries(labelInputs))$a('assetLabel'+suffix).value=s[key];for(const [key,suffix] of Object.entries(labelFlags))$a('assetLabelShow'+suffix).checked=s.show[key];labelPaperControls();labelPresetNote()}
 function labelCollect(){const s={...labelSettingsOriginal,show:{}};for(const [key,suffix] of Object.entries(labelInputs))s[key]=$a('assetLabel'+suffix).value;for(const [key,suffix] of Object.entries(labelFlags))s.show[key]=$a('assetLabelShow'+suffix).checked;return L.normalize(s)}
 function labelPaperControls(){const single=$a('assetLabelPaper').value==='single';for(const suffix of ['Product','Columns','Rows','GapX','GapY','MarginX','MarginY','OffsetX','OffsetY','Start'])$a('assetLabel'+suffix).disabled=busy||single;}
 function labelCurrent(){const current=store().items.filter(x=>labelItems.some(item=>item.id===x.id));if(current.length!==labelItems.length||L.fingerprint(current)!==labelFingerprint)throw Error('선택한 물품 정보가 바뀌었습니다. 창을 닫고 최신 목록에서 다시 선택하세요.');return current}
 function labelPreview(){const plan=L.plan(labelCurrent(),labelCollect());$a('assetLabelPreview').innerHTML=L.html(plan);const overflow=[...$a('assetLabelPreview').querySelectorAll('.asset-sticker')].some(el=>el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+2);if(overflow)throw Error('내용이 라벨 칸을 넘습니다. 글자 크기를 줄이거나 라벨 높이·너비를 늘린 뒤 다시 미리보기를 확인하세요.');$a('assetLabelStatus').textContent=plan.labels+'장 · '+plan.pages.length+'페이지 · '+plan.settings.width+'×'+plan.settings.height+'mm · '+(plan.settings.paper==='a4'?'A4':'한 장씩');return plan}
 $a('assetLabels').textContent='라벨지출력';
 $a('assetLabels').onclick=()=>{if(!ready())return;labelItems=shown.filter(x=>selection.has(x.id)).map(x=>({...x}));if(!labelItems.length){$a('assetStatus').textContent='라벨을 출력할 물품을 선택하세요.';return}labelFingerprint=L.fingerprint(labelItems);labelSettingsOriginal=store().labelSettings||{};labelFill({...L.defaults,...labelSettingsOriginal,institution:typeof labelSettingsOriginal.institution==='string'&&labelSettingsOriginal.institution.trim()?labelSettingsOriginal.institution:L.defaults.institution,year:Number(TODAY.slice(0,4)),start:1,copies:1});$a('assetLabelPreview').innerHTML='';$a('assetLabelStatus').textContent=labelItems.length+'개 물품을 선택했습니다. 기관명과 규격을 입력한 뒤 미리보기를 확인하세요.';labelDialog.showModal()};
 labelDialog.querySelector('[data-label-close]').onclick=()=>{if(!busy)labelDialog.close()};
 $a('assetLabelPaper').onchange=()=>{const institution=$a('assetLabelInstitution').value,year=$a('assetLabelYear').value,paper=$a('assetLabelPaper').value;labelFill(paper==='single'?{...L.defaults,institution,year,paper,width:70,height:45}:{...L.defaults,institution,year});$a('assetLabelPreview').innerHTML='';};

 $a('assetLabelProduct').onchange=()=>{const id=$a('assetLabelProduct').value;try{if(id!=='custom')labelFill(L.applyPreset(labelPresetBase(),id));else labelPresetNote();$a('assetLabelPreview').innerHTML='';$a('assetLabelStatus').textContent='선택한 제품의 규격이 채워졌습니다. 미리보기를 확인하세요.'}catch(err){$a('assetLabelStatus').textContent=err.message}};
 $a('assetLabelPreset').onclick=()=>{try{const id=$a('assetLabelProduct').value,base=labelPresetBase();labelFill(id==='custom'?{...L.defaults,institution:base.institution,year:base.year,show:base.show}:L.applyPreset(base,id));$a('assetLabelPreview').innerHTML='';$a('assetLabelStatus').textContent='선택 규격을 다시 적용했습니다. 실제 라벨지와 맞춰 주세요.'}catch(err){$a('assetLabelStatus').textContent=err.message}};
 for(const suffix of ['Width','Height','Columns','Rows'])$a('assetLabel'+suffix).addEventListener('input',()=>{$a('assetLabelProduct').value='custom';labelPresetNote();$a('assetLabelPreview').innerHTML=''});
 $a('assetLabelForm').onsubmit=e=>{e.preventDefault();try{labelPreview()}catch(err){$a('assetLabelStatus').textContent=err.message}};
 $a('assetLabelSave').onclick=async()=>{if(!ready())return;try{const profile=L.saved(labelCollect()),s=store();s.labelSettings=profile;setBusy(true);labelDialog.setAttribute('aria-busy','true');labelDialog.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);await persist({...data,assetManagement:s});labelSettingsOriginal=profile;$a('assetLabelStatus').textContent='양식 설정 저장 완료. 물품·조사 결과·사진·이동 이력은 변경하지 않았습니다.'}catch(err){$a('assetLabelStatus').textContent='설정 저장 완료 미확인: '+err.message}finally{setBusy(false);labelDialog.setAttribute('aria-busy','false');labelDialog.querySelectorAll('button,input,select').forEach(el=>el.disabled=false);labelPaperControls()}};
 function labelCleanup(){if(!labelPrinting)return;labelPrinting=false;document.body.classList.remove('asset-printing');labelPageStyle.textContent='';printSheet.innerHTML='';$a('assetStatus').textContent='인쇄창을 닫았습니다. 실제 출력 여부는 선택한 프린터에서 확인하세요.'}
 $a('assetLabelPrint').onclick=async()=>{if(!ready()||labelPrinting||labelChecking)return;if(cloudPending||cloudSaving){$a('assetLabelStatus').textContent='물품 변경의 원본 저장이 끝난 뒤 출력하세요.';return}if(navigator.onLine===false){$a('assetLabelStatus').textContent='최신 물품 확인을 위해 인터넷 연결 후 출력하세요.';return}labelChecking=true;setBusy(true);labelDialog.setAttribute('aria-busy','true');labelDialog.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);try{labelPreview();$a('assetLabelStatus').textContent='서버의 최신 물품 내용 확인 중…';const snapshot=await rpc('getFacilityData');L.confirmItems(labelItems,C.store(snapshot.data||{}).items);const plan=labelPreview();printSheet.innerHTML=L.html(plan);labelPageStyle.textContent='@page{size:'+(plan.settings.paper==='a4'?'A4 portrait':plan.pageWidth+'mm '+plan.pageHeight+'mm')+';margin:0}';labelDialog.close();labelPrinting=true;document.body.classList.add('asset-printing');window.print()}catch(err){labelCleanup();$a('assetLabelStatus').textContent=err.message;$a('assetStatus').textContent=err.message}finally{labelChecking=false;setBusy(false);labelDialog.setAttribute('aria-busy','false');labelDialog.querySelectorAll('button,input,select').forEach(el=>el.disabled=false);labelPaperControls()}};
 window.addEventListener('afterprint',labelCleanup);

/* ASSET_LABEL_UI_END */
 const oldRender=render;render=function(){oldRender();if(tab==='assetManagement')renderAssets()};nav.onclick=()=>{switchTab('assetManagement');renderAssets()};
 window.AssetView={isBusy:()=>busy||processing,draftSignature:()=>JSON.stringify([photo,photoRequest?.source||'']),getContext:()=>({selected:selection.size,visible:shown.length,busy:busy||processing})};
 document.getElementById('assetManagement').dataset.assetReady='true';
 }catch(error){const target=document.getElementById('assetManagement');if(target){target.dataset.assetReady='error';const heading=document.createElement('h2');heading.textContent='재물관리등록';const notice=document.createElement('p');notice.setAttribute('role','alert');notice.textContent='재물관리 화면 초기화 오류: '+String(error&&error.message||error)+' · 최신 전체 세트와 새 버전 배포를 확인하세요.';target.replaceChildren(heading,notice);}}
})();

</script>
