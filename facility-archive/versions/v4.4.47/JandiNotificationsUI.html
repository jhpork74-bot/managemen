<style>.jandi-duty-panel p{font-size:14px;line-height:1.6;overflow-wrap:anywhere}.jandi-duty-panel button{min-height:44px}</style>
<script>
var JandiCalendarCanvas=(function(){
 'use strict';
 function wrap(ctx,text,width){let lines=[''];for(const char of String(text||'')){const n=lines.length-1;if(ctx.measureText(lines[n]+char).width>width&&lines[n])lines.push(char);else lines[n]+=char}return lines}
 function text(ctx,value,x,y,width,maxLines,size,color){let lines=[];for(;size>=12;size--){ctx.font='600 '+size+'px "Malgun Gothic","Noto Sans KR",sans-serif';lines=wrap(ctx,value,width);if(lines.length<=maxLines)break}ctx.fillStyle=color;const step=size+6;lines.slice(0,maxLines).forEach((line,i)=>ctx.fillText(line,x,y+i*step));}
 async function render(snapshot){
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const date=snapshot.date,month=date.slice(0,7),[year,number]=month.split('-').map(Number),first=new Date(month+'-01T12:00:00Z').getUTCDay(),last=new Date(Date.UTC(year,number,0)).getUTCDate(),rows=Math.ceil((first+last)/7),width=1680,cellH=240,top=160,bottom=52;
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=top+rows*cellH+bottom;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,canvas.height);ctx.textBaseline='top';
  text(ctx,year+'년 '+number+'월 '+(snapshot.site==='one'?'본관':'분관')+' 당직변경표',28,20,width-56,1,43,'#163e39');text(ctx,(snapshot.sequence||'')+'번째 변경 · 변경일 '+date+' · 생성 '+snapshot.stamp+' (한국시간)',28,80,width-56,1,24,'#526660');
  const cellW=width/7;['일','월','화','수','목','금','토'].forEach((day,i)=>{ctx.fillStyle='#edf4f1';ctx.fillRect(i*cellW,115,cellW,45);text(ctx,day,i*cellW+18,123,cellW-36,1,25,i===0?'#b63f42':i===6?'#325d9f':'#30483e')});
  for(let i=0;i<rows*7;i++){
   const day=i-first+1,x=(i%7)*cellW,y=top+Math.floor(i/7)*cellH,valid=day>0&&day<=last,key=month+'-'+String(day).padStart(2,'0'),entry=valid&&snapshot.roster.entries[key],holiday=valid&&(snapshot.roster.holidays||{})[key];
   ctx.fillStyle=!valid?'#f2f4f3':entry&&entry.requestedChange?'#fff0cb':!entry?'#f5f6f7':'#fff';ctx.fillRect(x,y,cellW,cellH);ctx.strokeStyle='#c9d7d1';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,cellW-1,cellH-1);if(!valid)continue;
   text(ctx,String(day),x+14,y+12,60,1,29,i%7===0?'#b63f42':i%7===6?'#325d9f':'#1e352d');
   if(key===date){ctx.strokeStyle='#bc7522';ctx.lineWidth=4;ctx.strokeRect(x+3,y+3,cellW-6,cellH-6)}
   if(entry){if(entry.requestedChange)text(ctx,'변경 반영',x+95,y+18,cellW-110,1,18,'#8b5715');text(ctx,entry.primaryName||'미지정',x+14,y+58,cellW-28,3,29,'#172e26');if(entry.lunchRequired)text(ctx,'점심 '+(entry.lunchName||'미지정'),x+14,y+161,cellW-28,2,23,'#735525');if(entry.baselineChanged)text(ctx,'원본 변경 확인 필요',x+14,y+217,cellW-28,1,15,'#a53831')}
   else if(holiday)text(ctx,holiday,x+14,y+62,cellW-28,3,22,'#a64b4b');
  }
  text(ctx,'노란색: 변경 반영 · 테두리: 이번 변경일 · 점심대체가 필요한 날만 두 번째 줄 표시',20,canvas.height-36,width-40,1,21,'#526660');
  let dataUrl='';for(const quality of [.9,.8,.68]){dataUrl=canvas.toDataURL('image/jpeg',quality);if(dataUrl.length<2400000)break}if(dataUrl.length>2800000)throw Error('달력 이미지 크기가 전송 한도를 넘었습니다.');
  return {dataUrl,rosterHash:snapshot.rosterHash,width:canvas.width,height:canvas.height};
 }
 return {render};
})();

(()=>{
 'use strict';
 const section=document.getElementById('dutyChanges');if(!section)return;
 const send=document.createElement('button');send.id='jandiSendImage';send.type='button';send.className='primary';send.textContent='잔디로 이미지 전송';send.style.minHeight='44px';section.querySelector('h2').after(send);
 const panel=document.createElement('div');panel.className='panel jandi-duty-panel';panel.innerHTML='<h3>잔디 이미지 전송</h3><p id="jandiConnection" role="status">잔디 설정 확인 중…</p><p id="jandiDelivery" role="status">수정·저장은 계속할 수 있습니다. 제목 옆 ‘잔디로 이미지 전송’을 누를 때만 선택한 월 달력을 보냅니다.</p><div class="flex"><button id="jandiRefresh" type="button">연결 상태 새로 확인</button><button id="jandiRetry" type="button" class="hidden">전송 결과 확인·재시도</button><button id="jandiResend" type="button" class="hidden">같은 달력 다시 전송</button></div><p class="mutedtext">여러 날짜를 저장한 뒤 최신 달력 전체를 한 번에 전송합니다. 웹앱 접속 링크는 표시하지 않습니다. 서버 성공 기록이 있으나 수신방에서 보이지 않을 때만 확인 후 다시 전송하세요.</p>';
 section.appendChild(panel);let last=null,sending=false;const $j=id=>document.getElementById(id);
 const resend=$j('jandiResend'),actions=document.createElement('div');actions.className='jandi-send-actions';actions.style.cssText='display:flex;gap:8px;flex-wrap:wrap;max-width:100%';send.before(actions);actions.append(send,resend);for(const button of [send,resend]){button.style.minHeight='44px';button.style.padding='10px 12px'}
 function rpc(name,...args){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('잔디 연결 응답을 확인하지 못했습니다.')),90000);google.script.run.withSuccessHandler(result=>{clearTimeout(timer);resolve(result)}).withFailureHandler(()=>{clearTimeout(timer);reject(Error('잔디 연결 응답을 확인하지 못했습니다.'))})[name](...args)})}
 async function status(){try{const s=await rpc('getDutyJandiStatus'),mode=s.mode==='topic'?'직원 전체 토픽':'개인 시험 대상 (나와의 대화)';$j('jandiConnection').textContent=!s.enabled?'잔디 연결 꺼짐 · Apps Script 설정을 확인하세요.':!s.imageReady?'Apps Script에서 enableJandiCalendarImages를 실행하세요.':s.mode==='topic'&&!s.testPassed?'개인 시험 발송 성공 확인 후 전체 토픽으로 전환하세요.':!(s.mode==='topic'?s.topicConfigured:s.testConfigured)?mode+' 연결 주소 설정이 필요합니다.':'수동 전송 대상: '+mode;return s}catch(error){$j('jandiConnection').textContent=error.message;return null}}
 function latest(context){return (DutyChangesCore.store(data,context.site).history||[]).filter(h=>h.date&&h.date.startsWith(context.month+'-')).slice(-1)[0]}
 async function deliver(retry){
  if(sending)return;
  const view=window.DutyChangesView&&window.DutyChangesView.getContext();
  if(!view){$j('jandiDelivery').textContent='DutyChangesUI HTML도 이번 버전으로 교체하세요.';return}
  if(view.busy||$j('dcDialog').open){$j('jandiDelivery').textContent='열린 변경창을 먼저 저장하거나 닫은 뒤 전송하세요.';return}
  if(!cloudReady||cloudBlocked){$j('jandiDelivery').textContent='클라우드 연결·저장 충돌을 확인하세요. 아직 전송하지 않았습니다.';return}
  const target={site:view.site,month:view.month};sending=true;send.disabled=true;$j('jandiRetry').disabled=true;$j('jandiResend').disabled=true;$j('jandiResend').classList.add('hidden');window.DutyChangesView.setSending(true);
  let posted=false;
  try{
   $j('jandiDelivery').textContent='선택한 월의 서버 저장 완료를 확인 중…';await saveAndWait();
   const event=latest(target);if(!event){$j('jandiDelivery').textContent='이 장소·월에 저장된 변경이력이 없습니다. 먼저 변경을 저장하세요.';return}
   if(retry&&(retry.site!==target.site||retry.month!==target.month||retry.eventId!==event.id)){$j('jandiDelivery').textContent='추가 수정 또는 조회 대상 변경이 있습니다. 제목 옆 ‘잔디로 이미지 전송’으로 최신 달력을 보내세요.';return}
   const s=await status();if(!s||!s.enabled||!s.imageReady||!(s.mode==='topic'?s.topicConfigured&&s.testPassed:s.testConfigured)){$j('jandiDelivery').textContent='잔디 설정을 확인하세요. 저장은 완료됐으며 아직 전송하지 않았습니다.';return}
   if(retry&&retry.mode!==s.mode){$j('jandiDelivery').textContent='전송 대상이 바뀌었습니다. 제목 옆 전송 버튼으로 현재 대상에 보내세요.';return}
   const context=retry||{...target,eventId:event.id,mode:s.mode||'test'};last=context;let result;
   for(let attempt=0;attempt<2;attempt++){
    const prepared=await rpc('prepareDutyJandiImage',context.site,context.eventId,context.mode,context.resendId||'');if(prepared.state!=='ready'){result=prepared;break}
    $j('jandiDelivery').textContent='최신 월간 달력을 JPG로 만드는 중…';const packet=await JandiCalendarCanvas.render(prepared);packet.manual=true;if(context.resendId)packet.resendId=context.resendId;
    $j('jandiDelivery').textContent='JPG 저장 및 잔디 전송 중…';posted=true;result=await rpc('notifyDutyChangeJandi',context.site,context.eventId,context.mode,packet);if(result.state!=='stale')break;
   }
   $j('jandiDelivery').textContent=(result.message||'잔디 전송 결과 미확인')+(result.sentAt?' ('+result.sentAt+' 한국시간)':'');$j('jandiRetry').classList.toggle('hidden',result.state==='sent');$j('jandiResend').classList.toggle('hidden',result.state!=='sent');
  }catch(error){$j('jandiDelivery').textContent=posted?'잔디 수신 여부 미확인 · 결과 확인 버튼으로 같은 요청의 처리 상태를 확인하세요.':'저장 또는 전송 준비 실패 · 아직 잔디에 요청하지 않았습니다. 상단 저장 상태를 확인하세요.';if(posted)$j('jandiRetry').classList.remove('hidden')}
  finally{sending=false;send.disabled=false;$j('jandiRetry').disabled=false;$j('jandiResend').disabled=false;window.DutyChangesView.setSending(false)}
 }
 function onSaved(){if(!sending){$j('jandiDelivery').textContent='변경을 저장했습니다. 계속 수정할 수 있으며, 제목 옆 ‘잔디로 이미지 전송’을 누를 때만 보냅니다.';$j('jandiResend').classList.add('hidden')}}
 // Compatibility with an older DutyChangesUI: saving must never send automatically.
 window.DutyJandi={onSaved,notify:async()=>onSaved()};
 send.onclick=()=>deliver(null);$j('jandiRefresh').onclick=status;$j('jandiRetry').onclick=()=>{if(last)deliver(last)};status();
 $j('jandiResend').onclick=()=>{
  if(!last||sending)return;
  const target=last.month+' '+(last.site==='one'?'본관':'분관')+' → '+(last.mode==='topic'?'직원 전체 토픽':'개인 시험 Webhook 수신방');
  if(!confirm(target+'\n기존 서버 성공 기록은 보존하고 달력 이미지 메시지 1건을 다시 보냅니다. 이미 받은 경우 중복될 수 있습니다. 다시 전송할까요?'))return;
  deliver({...last,resendId:'resend-'+uid()});
 };
 if(google.script.url&&typeof google.script.url.getLocation==='function')google.script.url.getLocation(location=>{const q=location.parameter||{};if(q.page!=='dutyChanges'||!['one','two'].includes(q.site)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(q.month||''))return;const date=typeof q.date==='string'&&q.date.startsWith(q.month+'-')&&/^\d{4}-\d{2}-\d{2}$/.test(q.date)?q.date:'';document.dispatchEvent(new CustomEvent('duty-changes-navigate',{detail:{site:q.site,month:q.month,date}}))});
})();

</script>
