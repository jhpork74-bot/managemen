<script>
window.FacilityLearningArticles=[
 {id:'learn-plan',category:'설치·보수',title:'시설을 새로 만들기 전, 요구사항 한 장부터',summary:'무엇을 설치할지보다 누가 어디서 어떻게 사용할지 먼저 정리합니다.',body:['1. 사용 장면을 적습니다. 이용자 동선, 휠체어 접근, 청소 공간과 기존 물품 이동을 기록하세요.','2. 현장을 기록합니다. 전체 사진, 설치 예정 위치, 폭·높이, 주변 문과 통행 공간을 함께 남기세요.','3. 업체에 같은 조건을 전달합니다. 설치 범위·자재·폐기물 처리·운영 중 통제·완료 확인 방법을 동일하게 적으면 견적 비교가 쉬워집니다.','4. 전기·가스·구조 변경은 해당 전문가에게 현장 검토와 필요한 절차를 확인한 후 진행합니다.','현장 적용: 다음 공사 의뢰서에 목적 / 위치 / 규격 / 작업시간 / 완료 확인 항목을 넣어 보세요.'],source:'배움터 자체 작성 · 관련 참고: 국토안전관리원',url:'https://www.kalis.or.kr/'},
 {id:'learn-repair',category:'설치·보수',title:'보수 사진, 전·중·후를 같은 위치에서',summary:'작업 결과를 설명할 수 있는 사진 기록 습관을 만듭니다.',body:['작업 전: 전체 위치를 알아볼 사진과 손상 부위의 가까운 사진을 나눠 남깁니다.','작업 중: 교체 자재의 모델, 가려지기 전 연결 상태, 업체 확인 사항을 기록합니다. 위험 구역에 사진 촬영 때문에 접근하지 않습니다.','작업 후: 처음과 같은 각도에서 촬영하고 실제 작동 확인 결과를 함께 적습니다.','사진만으로 완료를 판단하지 말고 누수·작동·마감·청소 등 해당 작업의 인수 기준을 확인합니다.','현장 적용: 앱의 고장·공사관리 전/중/후 사진과 조치 내용을 함께 채워 보세요.'],source:'배움터 자체 작성 · 관련 참고: 국토안전관리원',url:'https://www.kalis.or.kr/'},
 {id:'learn-walk',category:'관리 요령',title:'점검은 발견 → 조치 → 재확인까지',summary:'체크 완료와 고장 해결을 구분하면 누락이 줄어듭니다.',body:['점검 동선을 본관·분관별로 정하고 같은 순서로 돌아보세요.','이상 발견 시 위치, 현상, 발견 시각을 기록합니다. 원인을 확정하지 못했다면 추정이라고 표시하세요.','즉시 위험이 있으면 이용을 제한하고 담당자에게 전달합니다. 직접 보수할지 전문업체에 의뢰할지 구분합니다.','조치 후 재확인 날짜와 결과를 남깁니다. 점검을 했다는 기록과 문제가 해결됐다는 기록을 분리하세요.'],source:'배움터 자체 작성 · 관련 참고: 국토안전관리원',url:'https://www.kalis.or.kr/'},
 {id:'learn-fire',category:'관리 요령',title:'겨울철 화재예방, 관찰과 기록부터',summary:'전열기와 통행 공간을 함께 살펴보는 짧은 학습 카드입니다.',body:['전열기 주변의 가연물, 전선 외관 손상, 콘센트의 변색 등 눈에 보이는 이상을 확인합니다.','전기 설비에서 이상음·탄 흔적 등을 발견하면 임의 분해하지 말고 사용 중단과 전문 확인을 요청하세요.','소화기 위치와 피난 동선의 물건 적치를 함께 살펴봅니다. 설비별 공식 점검 기준은 해당 담당자와 확인합니다.','현장 적용: 위험 징후를 발견한 장소를 사진과 함께 고장관리 또는 업무 일정에 등록해 보세요.'],source:'관련 참고: 제주특별자치도 농업기술원 전기안전 자료 · 학습용 재구성',url:'https://agri.jeju.go.kr/files/board/90a733d7-1399-4101-80d3-aee9ca09f3a3.pdf'},
 {id:'learn-record',category:'문서·읽을거리',title:'업무일지에 남길 다섯 가지',summary:'다음 담당자가 읽어도 같은 상황을 이해하도록 작성합니다.',body:['언제: 발견일과 처리일을 구분합니다.','어디서: 본관·분관, 층, 실명 등 재방문 가능한 위치를 씁니다.','무엇을: 관찰한 사실과 요청 내용을 구분합니다.','어떻게: 직접 처리, 업체 요청, 대기 사유와 진행 상태를 기록합니다.','다음 확인: 완료 기준과 재확인할 날짜를 남깁니다. 이 양식은 실무 제안이며 법정 서식을 대체하지 않습니다.'],source:'배움터 자체 작성 · 관련 읽을거리: 월간 안전보건',url:'https://www.kosha.or.kr/ebook/fcatalog/include/monthly_list.jsp'},
 {id:'learn-read',category:'문서·읽을거리',title:'안전 자료를 업무에 적용하는 읽기 순서',summary:'좋은 자료를 읽고 끝내지 않고 우리 시설의 확인 항목으로 바꿉니다.',body:['자료의 발행 기관과 발행일을 먼저 확인하세요. 오래된 법령·점검 주기는 현재 기준과 대조합니다.','대상 시설과 작업 조건이 우리 현장에 맞는지 확인합니다.','핵심 내용을 한 문장으로 적고, 우리 시설에서 확인할 장소를 하나 골라보세요.','점검표에 추가할 항목, 담당자에게 물어볼 질문, 업체에 확인할 사항을 구분해서 메모합니다.'],source:'배움터 자체 작성 · 관련 참고: 한국소방안전원',url:'https://www.kfsi.or.kr/intro/main/home.do'}
].map(function(a){return Object.assign({kind:'guide',publishedAt:'2026-11-05',edition:'상시 학습 · 2026-11-05 작성'},a)});

(function(){
 'use strict';if(window.FacilityLearningView)return;
 var root=document.createElement('section');root.id='facilityLearning';root.className='hidden';
 root.innerHTML='<div class="learn-head"><div><small>FACILITY LEARNING · 매일 조금씩 배우는 현장 지식</small><h2>시설관리 배움터</h2><p>좌우로 넘겨 고르고, 앱 안에서 읽고, 책갈피로 다시 만나세요.</p></div><span class="learn-emblem" aria-hidden="true">📚</span></div><div class="learn-toolbar"><button type="button" data-learn-view="all" aria-pressed="true">오늘의 카드</button><button type="button" data-learn-view="saved" aria-pressed="false">🔖 저장한 자료</button><button type="button" id="learnRefresh">새 자료 확인</button></div><p id="learnStatus" role="status"></p><div class="learn-filter"><label>분야 <select id="learnCategory"><option>전체</option><option>시설 이슈</option><option>설치·보수</option><option>관리 요령</option><option>문서·읽을거리</option></select></label><label>카드 찾기 <input id="learnQuery" type="search" placeholder="제목·내용 검색"></label></div><div class="learn-slider-controls"><button type="button" id="learnPrev" aria-label="이전 카드">← 이전</button><span id="learnCount" aria-live="polite"></span><button type="button" id="learnNext" aria-label="다음 카드">다음 →</button></div><div id="learnTrack" class="learn-track" tabindex="0" aria-label="시설관리 카드뉴스. 좌우로 밀어 넘기세요"></div><article id="learnDetail" class="learn-detail" hidden></article><p class="learn-foot">공식 소식은 게시일 기준으로 표시합니다. 상시 학습 카드는 새 기사와 구분합니다. 원문 전체·외부 영상은 앱에 복제하지 않으며, 아래 출처 링크로 별도 확인할 수 있습니다.</p>';
 document.querySelector('main').appendChild(root);
 var nav=document.createElement('button');nav.type='button';nav.dataset.tab='facilityLearning';nav.textContent='📚 시설관리 배움터';var anchor=document.querySelector('[data-tab="dutyChanges"]');if(anchor)anchor.after(nav);else document.querySelector('main>nav.tabs').appendChild(nav);nav.onclick=function(){switchTab('facilityLearning')};
 var $l=function(id){return root.querySelector('#'+id)},feed={articles:[]},loading=false,loadedDay='',view='all',position=0,list=[],busy=false,selectedId=null,stamp='';
 var safe=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
 function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date())}
 function bookmarks(){return typeof data==='object'&&Array.isArray(data.learningBookmarks)?data.learningBookmarks:[]}
 function saved(id){return bookmarks().some(function(a){return a.id===id})}
 function message(){var s=feed.error||feed.message||'공식 소식을 확인합니다. 상시 학습 카드는 바로 읽을 수 있습니다.';if(feed.checkedAt)s+=' · 마지막 정상 확인 '+new Date(feed.checkedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'});$l('learnStatus').textContent=s+(loading?' · 불러오는 중…':'');}
 function updateCount(){var cards=Array.from($l('learnTrack').children);if(cards.length){var left=$l('learnTrack').scrollLeft;position=cards.reduce(function(best,c,i){return Math.abs(c.offsetLeft-cards[0].offsetLeft-left)<Math.abs(cards[best].offsetLeft-cards[0].offsetLeft-left)?i:best},0)}$l('learnCount').textContent=list.length?(position+1)+' / '+list.length:'표시할 카드가 없습니다.';$l('learnPrev').disabled=position<=0;$l('learnNext').disabled=position>=list.length-1;}
 function renderCards(){
  var q=$l('learnQuery').value.trim().toLocaleLowerCase(),cat=$l('learnCategory').value;
  list=(view==='saved'?bookmarks():feed.articles.concat(window.FacilityLearningArticles||[])).filter(function(a){return (cat==='전체'||a.category===cat)&&(!q||(a.title+' '+a.summary+' '+(a.body||[]).join(' ')).toLocaleLowerCase().includes(q))});
  root.querySelector('[data-learn-view="saved"]').textContent='🔖 저장한 자료 ('+bookmarks().length+')';
  $l('learnTrack').innerHTML=list.map(function(a,i){var titleDate=String(a.publishedAt||'').slice(0,10);return '<article class="learn-card tone-'+(i%4)+'"><span class="learn-tag">'+safe(a.category)+'</span><small>'+safe(a.kind==='news'?'공식 소식 · '+titleDate:a.edition||'저장한 학습 자료')+'</small><button class="learn-open" type="button" data-read="'+i+'"><span class="learn-card-number">'+String(i+1).padStart(2,'0')+'</span><h3>'+safe(a.title)+'</h3><p>'+safe(a.summary||'앱 안에서 자료 소개를 확인하세요.')+'</p><span class="learn-read-label">내용 읽기 ↗</span></button><div class="learn-card-bottom"><span>'+safe(a.source)+'</span><button type="button" data-mark="'+i+'" aria-pressed="'+saved(a.id)+'" '+(busy?'disabled':'')+'>'+ (saved(a.id)?'🔖 저장됨':'🔖 책갈피')+'</button></div></article>'}).join('');
  $l('learnTrack').scrollLeft=0;position=0;updateCount();if(selectedId){var a=list.find(function(x){return x.id===selectedId});if(a)detail(a,false);else{$l('learnDetail').hidden=true;selectedId=null;}}
  stamp=JSON.stringify(bookmarks());message();
 }
 function detail(a,scroll){selectedId=a.id;var d=$l('learnDetail');d.hidden=false;d.innerHTML='<div class="learn-detail-top"><span>'+safe(a.category)+'</span><button type="button" id="learnCloseDetail">읽기 접기</button></div><h3>'+safe(a.title)+'</h3><p class="learn-lead">'+safe(a.summary)+'</p>'+(a.body||[]).map(function(p){return '<p>'+safe(p)+'</p>'}).join('')+'<footer><p>'+safe(a.source)+' · '+safe(String(a.publishedAt||'').slice(0,10))+'</p>'+(/^https:\/\//.test(a.url||'')?'<a href="'+safe(a.url)+'" target="_blank" rel="noopener noreferrer">출처 원문 확인 (새 창)</a>':'')+'</footer>';$l('learnCloseDetail').onclick=function(){d.hidden=true;selectedId=null};if(scroll)d.scrollIntoView({behavior:'smooth',block:'nearest'});}
 async function mark(a){if(busy)return;busy=true;renderCards();try{await saveAndWait();var old=bookmarks();if(saved(a.id))data=Object.assign({},data,{learningBookmarks:old.filter(function(x){return x.id!==a.id})});else{if(old.length>=300)throw Error('책갈피 300개 한도입니다. 필요 없는 책갈피를 해제해 주세요.');data=Object.assign({},data,{learningBookmarks:old.concat([Object.assign({},a,{bookmarkedAt:new Date().toISOString()})])});}await saveAndWait();$l('learnStatus').textContent='책갈피 서버 저장 완료. 같은 웹앱의 다른 기기에서도 볼 수 있습니다.';}catch(e){$l('learnStatus').textContent='책갈피 저장을 확인하지 못했습니다. '+e.message+' 클라우드 상태를 확인해 주세요.';}finally{busy=false;var notice=$l('learnStatus').textContent;renderCards();$l('learnStatus').textContent=notice;}}
 function load(){if(loading)return;loading=true;$l('learnRefresh').disabled=true;message();var settled=false;var timer=setTimeout(function(){if(!settled){settled=true;loading=false;$l('learnRefresh').disabled=false;feed.error='자료 조회 시간이 초과되었습니다. 기존 카드와 책갈피를 유지합니다.';message();}},45000);function end(result,error){if(settled)return;settled=true;clearTimeout(timer);loading=false;$l('learnRefresh').disabled=false;if(error){feed.error='자료 수집 실패: '+error.message;}else{feed=result;loadedDay=today();}renderCards();}try{google.script.run.withSuccessHandler(function(r){end(r,null)}).withFailureHandler(function(e){end(null,e)}).getFacilityLearningFeed()}catch(e){end(null,e)}}
 root.addEventListener('click',function(e){var r=e.target.closest('[data-read]'),m=e.target.closest('[data-mark]'),v=e.target.closest('[data-learn-view]');if(r)detail(list[Number(r.dataset.read)],true);if(m)mark(list[Number(m.dataset.mark)]);if(v){view=v.dataset.learnView;root.querySelectorAll('[data-learn-view]').forEach(function(b){b.setAttribute('aria-pressed',b===v)});renderCards();}});
 function step(n){var cards=$l('learnTrack').children,target=cards[Math.max(0,Math.min(cards.length-1,position+n))];if(target)$l('learnTrack').scrollTo({left:target.offsetLeft-cards[0].offsetLeft,behavior:'smooth'});}
 $l('learnPrev').onclick=function(){step(-1)};$l('learnNext').onclick=function(){step(1)};$l('learnTrack').addEventListener('scroll',updateCount,{passive:true});$l('learnTrack').addEventListener('keydown',function(e){if(e.target!==$l('learnTrack'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();step(e.key==='ArrowRight'?1:-1)}});
 $l('learnQuery').oninput=renderCards;$l('learnCategory').onchange=renderCards;$l('learnRefresh').onclick=load;
 var originalRender=render;render=function(){originalRender.apply(this,arguments);if(tab==='facilityLearning'){renderCards();if(loadedDay!==today())load();}};
 setInterval(function(){if(!document.hidden&&tab==='facilityLearning'){if(stamp!==JSON.stringify(bookmarks()))renderCards();if(loadedDay!==today()&&!loading)load();}},60000);
 window.FacilityLearningView={render:renderCards};renderCards();
})();

</script>
